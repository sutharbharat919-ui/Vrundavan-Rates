<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOPL GOLD</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:linear-gradient(#2b1608,#100c09 45%,#0d0d0d);
color:#f4e4dc;
font-family:Arial,sans-serif;
}

header{
padding:50px 20px;
text-align:center;
background:#2b1608;
border-bottom:1px solid #765132;
}

header h1{
margin:0;
font-size:38px;
}

header p{
font-size:21px;
color:#d8bfb3;
}

.container{
max-width:700px;
margin:auto;
padding:40px 25px;
}

.card{
background:#1d1d1d;
border:1px solid #66554d;
border-radius:28px;
padding:35px;
margin-bottom:30px;
}

h2{margin-top:0}

.rate{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px;
background:#1d1917;
border:1px solid #66554d;
border-radius:20px;
font-size:22px;
}

.price{
font-size:25px;
font-weight:bold;
}

input{
width:100%;
padding:18px;
margin:8px 0;
border-radius:15px;
border:1px solid #765132;
background:#292929;
color:white;
font-size:17px;
}

button{
width:100%;
padding:17px;
margin-top:12px;
border:0;
border-radius:15px;
background:#d4af37;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

.secondary{
background:#444;
color:white;
}

.hidden{
display:none!important;
}

#message{
text-align:center;
margin-top:20px;
min-height:25px;
line-height:1.5;
}

.adminEmail{
text-align:center;
color:#d4af37;
margin-bottom:15px;
}
</style>
</head>

<body>

<header>
<h1>VOPL GOLD</h1>
<p>Live Gold Rate</p>
</header>

<div class="container">

<div class="card">

<h2>આજનો ભાવ</h2>

<div class="rate">

<span>Gold 24K</span>

<span class="price">
₹<span id="gold24k">Loading...</span>
</span>

</div>

</div>


<div id="loginBox" class="card">

<h2>Admin Login</h2>

<input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="username">

<input
id="password"
type="password"
placeholder="Admin Password"
autocomplete="current-password">

<button id="loginBtn">
LOGIN
</button>

</div>


<div id="adminBox" class="card hidden">

<h2>Admin Rate Update</h2>

<div id="adminEmail" class="adminEmail"></div>

<input
id="newGold24k"
type="number"
inputmode="decimal"
placeholder="Enter Gold 24K Rate">

<button id="updateBtn">
UPDATE RATE
</button>

<button id="logoutBtn" class="secondary">
LOGOUT
</button>

</div>

<div id="message"></div>

</div>


<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import{
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


import{
getFirestore,
doc,
onSnapshot,
updateDoc,
serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyACpWFqxs1AaIx7C6kMpu45bD79fWJeR60",

authDomain:"reset-de458.firebaseapp.com",

projectId:"reset-de458",

storageBucket:"reset-de458.firebasestorage.app",

messagingSenderId:"192490668353",

appId:"1:192490668353:web:e8ce193dab2d3c4f7061c0",

measurementId:"G-NKVEWN4YSC"

};


const ADMIN_EMAIL="office.vopl@gmail.com";


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const rateRef=doc(db,"rates","current");


const gold24k=document.getElementById("gold24k");

const loginBox=document.getElementById("loginBox");

const adminBox=document.getElementById("adminBox");

const emailInput=document.getElementById("email");

const passwordInput=document.getElementById("password");

const newGoldInput=document.getElementById("newGold24k");

const adminEmail=document.getElementById("adminEmail");

const message=document.getElementById("message");

const loginBtn=document.getElementById("loginBtn");

const updateBtn=document.getElementById("updateBtn");

const logoutBtn=document.getElementById("logoutBtn");


function showMessage(text){

message.textContent=text;

}


/* LIVE RATE */


onSnapshot(rateRef,

(snapshot)=>{

if(!snapshot.exists()){

gold24k.textContent="No Data";

showMessage("Firestore rates/current document મળ્યો નથી.");

return;

}

const data=snapshot.data();

const value=Number(data.gold24k);

if(!Number.isFinite(value)){

gold24k.textContent="Invalid";

return;

}

gold24k.textContent=value.toLocaleString("en-IN");

newGoldInput.value=value;

},

(error)=>{

console.error(error);

gold24k.textContent="Error";

showMessage("Rate Load Error: "+error.code);

});


/* ADMIN LOGIN */


loginBtn.addEventListener("click",async()=>{

const email=emailInput.value.trim().toLowerCase();

const password=passwordInput.value;


if(email!==ADMIN_EMAIL){

showMessage("આ Email Admin નથી.");

return;

}


if(!password){

showMessage("Password દાખલ કરો.");

return;

}


loginBtn.disabled=true;

showMessage("Login થઈ રહ્યું છે...");


try{

const credential=

await signInWithEmailAndPassword(

auth,

email,

password

);


if(

!credential.user.email ||

credential.user.email.toLowerCase()!==ADMIN_EMAIL

){

await signOut(auth);

showMessage("Unauthorized Account");

return;

}


passwordInput.value="";

showMessage("Admin Login Successful");


}catch(error){

console.error(error);

showMessage("Login Failed: "+error.code);

}


finally{

loginBtn.disabled=false;

}

});


/* AUTH STATUS */


onAuthStateChanged(auth,async(user)=>{

const isAdmin=

user &&

user.email &&

user.email.toLowerCase()===ADMIN_EMAIL;


if(isAdmin){

loginBox.classList.add("hidden");

adminBox.classList.remove("hidden");

adminEmail.textContent=user.email;

}

else{

if(user){

await signOut(auth);

}

loginBox.classList.remove("hidden");

adminBox.classList.add("hidden");

adminEmail.textContent="";

}

});


/* UPDATE RATE */


updateBtn.addEventListener("click",async()=>{

const value=Number(newGoldInput.value);


if(!Number.isFinite(value)||value<=0){

showMessage("સાચો Rate દાખલ કરો.");

return;

}


const user=auth.currentUser;
