rules_version = '2';

service cloud.firestore {
  match /databases/{database}/documents {

    match /rates/{document=**} {
      allow read: if true;

      allow write: if request.auth != null
                   && request.auth.token.email == "office.vopl@gmail.com";
    }

    match /{document=**} {
      allow read, write: if false;
    }
  }
}
