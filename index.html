<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VOPL GOLD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #321b0b 0%, #160e08 35%, #0d0d0d 100%);
      color: #f4e4dc;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 55px 20px;
      background: rgba(45, 22, 6, 0.75);
      border-bottom: 1px solid #765132;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 2px;
    }

    header p {
      margin: 14px 0 0;
      font-size: 21px;
      color: #d8bfb3;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 40px 25px;
    }

    .card {
      background: rgba(30, 30, 30, 0.96);
      border: 1px solid #66554d;
      border-radius: 30px;
      padding: 38px;
      margin-bottom: 35px;
    }

    h2 {
      margin-top: 0;
      font-size: 31px;
    }

    .line {
      height: 1px;
      background: #5b514d;
      margin: 25px 0 30px;
    }

    .rate {
      display: flex;
      justify-content: space-between;
      align-items: center;

      background: #1d1917;
      border: 1px solid #66554d;
      border-radius: 22px;

      padding: 28px 25px;

      font-size: 23px;
    }

    .price {
      font-size: 26px;
      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 20px;

      margin: 8px 0;

      border-radius: 18px;
      border: 1px solid #765132;

      background: #292929;
      color: white;

      font-size: 18px;
    }

    button {
      width: 100%;

      padding: 18px;

      margin-top: 15px;

      border: none;
      border-radius: 18px;

      background: #d4af37;
      color: #111;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      background: #444;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    #message {
      text-align: center;
      font-size: 17px;
      line-height: 1.5;
      min-height: 25px;
      margin-top: 20px;
    }

    .admin-email {
      text-align: center;
      color: #d4af37;
      margin-bottom: 20px;
      word-break: break-all;
    }

    @media (max-width: 500px) {

      header {
        padding: 45px 15px;
      }

      header h1 {
        font-size: 32px;
      }

      .container {
        padding: 30px 20px;
      }

      .card {
        padding: 28px 25px;
      }

      .rate {
        font-size: 20px;
      }

      .price {
        font-size: 22px;
      }
    }
  </style>
</head>


<body>


<header>

  <h1>VOPL GOLD</h1>

  <p>Live Gold Rate</p>

</header>



<div class="container">


  <!-- LIVE RATE -->


  <div class="card">

    <h2>આજનો ભાવ</h2>

    <div class="line"></div>


    <div class="rate">

      <span>Gold 24K</span>


      <span class="price">

        ₹<span id="gold24k">Loading...</span>

      </span>

    </div>

  </div>



  <!-- LOGIN BOX -->


  <div id="loginBox" class="card">

    <h2>Admin Panel</h2>

    <div class="line"></div>


    <input
      id="email"
      type="email"
      placeholder="Admin Email"
      autocomplete="email"
    >


    <button id="sendLinkBtn">

      SEND LOGIN LINK

    </button>


    <div id="finishLoginBox" class="hidden">

      <input
        id="confirmEmail"
        type="email"
        placeholder="Confirm Admin Email"
        autocomplete="email"
      >


      <button id="finishLoginBtn">

        COMPLETE LOGIN

      </button>

    </div>

  </div>



  <!-- ADMIN PANEL -->


  <div id="adminBox" class="card hidden">


    <h2>Admin Rate Update</h2>

    <div class="line"></div>


    <div
      id="loggedAdmin"
      class="admin-email">
    </div>


    <input
      id="newGold24k"
      type="number"
      inputmode="decimal"
      step="0.01"
      placeholder="Enter Gold 24K Rate"
    >


    <button id="updateBtn">

      UPDATE RATE

    </button>


    <button
      id="logoutBtn"
      class="secondary">

      LOGOUT

    </button>


  </div>


  <div id="message"></div>


</div>



<script type="module">


/* =============================

FIREBASE IMPORTS

============================= */


import {

  initializeApp

}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";



import {

  getAuth,

  sendSignInLinkToEmail,

  isSignInWithEmailLink,

  signInWithEmailLink,

  onAuthStateChanged,

  signOut

}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";



import {

  getFirestore,

  doc,

  onSnapshot,

  updateDoc

}

from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";




/* =============================

FIREBASE CONFIG

============================= */


const firebaseConfig = {

  apiKey:
  "AIzaSyACpWFqxs1AaIx7C6kMpu45bD79fWJeR60",

  authDomain:
  "reset-de458.firebaseapp.com",

  projectId:
  "reset-de458",

  storageBucket:
  "reset-de458.firebasestorage.app",

  messagingSenderId:
  "192490668353",

  appId:
  "1:192490668353:web:e8ce193dab2d3c4f7061c0",

  measurementId:
  "G-NKVEWN4YSC"

};



/* =============================

SETTINGS

============================= */


const ADMIN_EMAIL =

"office.vopl@gmail.com";



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);


const rateRef =

doc(db, "rates", "current");




/* =============================

HTML ELEMENTS

============================= */


const gold24k =

document.getElementById("gold24k");


const loginBox =

document.getElementById("loginBox");


const adminBox =

document.getElementById("adminBox");


const emailInput =

document.getElementById("email");


const confirmEmailInput =

document.getElementById("confirmEmail");


const finishLoginBox =

document.getElementById("finishLoginBox");


const newGoldInput =

document.getElementById("newGold24k");


const loggedAdmin =

document.getElementById("loggedAdmin");


const message =

document.getElementById("message");


const sendLinkBtn =

document.getElementById("sendLinkBtn");


const finishLoginBtn =

document.getElementById("finishLoginBtn");


const updateBtn =

document.getElementById("updateBtn");


const logoutBtn =

document.getElementById("logoutBtn");




/* =============================

MESSAGE

============================= */


function showMessage(text) {

  message.textContent = text;

}




/* =============================

LIVE FIRESTORE RATE

============================= */


onSnapshot(

  rateRef,


  (snapshot) => {


    if (!snapshot.exists()) {

      gold24k.textContent = "No Data";

      showMessage(
        "Firestore rates/current document મળ્યો નથી."
      );

      return;

    }


    const data = snapshot.data();


    const value = Number(data.gold24k);


    if (!Number.isFinite(value)) {

      gold24k.textContent = "Invalid Rate";

      return;

    }


    gold24k.textContent =

      value.toLocaleString("en-IN");


    newGoldInput.value = value;

  },


  (error) => {

    console.error(error);

    gold24k.textContent = "Error";

    showMessage(

      "Rate Load Error: " + error.code

    );

  }

);




/* =============================

SEND EMAIL LOGIN LINK

============================= */


sendLinkBtn.addEventListener(

"click",

async () => {


  const email =

  emailInput.value
  .trim()
  .toLowerCase();



  if (!email) {

    showMessage(
      "Admin email દાખલ કરો."
    );

    return;

  }



  if (email !== ADMIN_EMAIL) {

    showMessage(
      "આ email Admin નથી."
    );

    return;

  }



  sendLinkBtn.disabled = true;


  showMessage(

    "Login link મોકલવામાં આવી રહી છે..."

  );



  try {


    const actionCodeSettings = {

      url:

      window.location.origin +

      window.location.pathname,

      handleCodeInApp: true

    };



    await sendSignInLinkToEmail(

      auth,

      email,

      actionCodeSettings

    );



    window.localStorage.setItem(

      "voplAdminEmail",

      email

    );



    showMessage(

      "Login link email પર મોકલવામાં આવી છે. Email ખોલીને link પર click કરો."

    );


  }


  catch (error) {


    console.error(error);


    showMessage(

      "Send Link Failed: " +

      error.code

    );


  }


  finally {


    sendLinkBtn.disabled = false;


  }


});




/* =============================

COMPLETE EMAIL LINK LOGIN

============================= */


async function completeEmailLogin() {


  if (!isSignInWithEmailLink(

    auth,

    window.location.href

  )) {

    return;

  }



  let email =

  window.localStorage.getItem(

    "voplAdminEmail"

  );



  if (!email) {


    finishLoginBox.classList.remove(

      "hidden"

    );


    showMessage(

      "Login complete કરવા Admin Email ફરી દાખલ કરો."

    );


    return;

  }



  await finishSignIn(email);

}




async function finishSignIn(email) {


  email =

  email.trim().toLowerCase();



  if (email !== ADMIN_EMAIL) {

    showMessage(

      "આ email Admin નથી."

    );

    return;

  }



  try {


    const credential =

    await signInWithEmailLink(

      auth,

      email,

      window.location.href

    );



    if (

      !credential.user.email ||

      credential.user.email.toLowerCase()

      !== ADMIN_EMAIL

    ) {


      await signOut(auth);


      showMessage(

        "Unauthorized Account"

      );


      return;

    }



    window.localStorage.removeItem(

      "voplAdminEmail"

    );



    showMessage(

      "Admin Login Successful"

    );



    window.history.replaceState(

      {},

      document.title,

      window.location.origin +

      window.location.pathname

    );


  }


  catch (error) {


    console.error(error);


    showMessage(

      "Login Failed: " +

      error.code

    );


  }


}




finishLoginBtn.addEventListener(

"click",

async () => {


  const email =

  confirmEmailInput.value.trim();


  if (!email) {

    showMessage(

      "Admin email દાખલ કરો."

    );

    return;

  }


  await finishSignIn(email);


});




/* =============================

AUTH STATUS

============================= */


onAuthStateChanged(

auth,

async (user) => {


  const isAdmin =

    user &&

    user.email &&

    user.email.toLowerCase()

    === ADMIN_EMAIL;



  if (isAdmin) {


    loginBox.classList.add(

      "hidden"

    );


    adminBox.classList.remove(

      "hidden"

    );


    loggedAdmin.textContent =

      user.email;


  }


  else {


    if (user) {

      await signOut(auth);

    }


    loginBox.classList.remove(

      "hidden"

    );


    adminBox.classList.add(

      "hidden"

    );


    loggedAdmin.textContent = "";


  }


});




/* =============================

UPDATE GOLD RATE

============================= */


updateBtn.addEventListener(

"click",

async () => {


  const value =

  Number(newGoldInput.value);



  if (

    !Number.isFinite(value) ||

    value <= 0

  ) {


    showMessage(

      "સાચો rate દાખલ કરો."

    );


    return;

  }



  const user = auth.currentUser;



  if (

    !user ||

    !user.email ||

    user.email.toLowerCase()

    !== ADMIN_EMAIL

  ) {


    showMessage(

      "Admin Login જરૂરી છે."

    );


    return;

  }



  updateBtn.disabled = true;


  showMessage(

    "Rate update થઈ રહ્યો છે..."

  );



  try {


    await updateDoc(

      rateRef,

      {

        gold24k: value

      }

    );


    showMessage(

      "Rate Successfully Updated"

    );


  }


  catch (error) {


    console.error(error);


    showMessage(

      "Update Failed: " +

      error.code

    );


  }


  finally {


    updateBtn.disabled = false;


  }


});




/* =============================

LOGOUT

============================= */


logoutBtn.addEventListener(

"click",

async () => {


  try {


    await signOut(auth);


    showMessage(

      "Logged Out"

    );


  }


  catch (error) {


    showMessage(

      "Logout Failed: " +

      error.code

    );


  }


});




/* =============================

START EMAIL LOGIN CHECK

============================= */


completeEmailLogin();


</script>


</body>
</html>
