<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOPL GOLD</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f0e8;
  color:#49372f;
}

header{
  background:#876451;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:750px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border:1px solid #d5c0b1;
  border-radius:22px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
}

h2{
  margin-top:0;
}

.rate{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px 0;
  border-bottom:1px solid #eee;
  font-size:20px;
}

.rate:last-child{
  border-bottom:0;
}

.price{
  font-weight:bold;
  color:#876451;
  white-space:nowrap;
}

input,
select{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #cbb6a7;
  border-radius:12px;
  font-size:17px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#876451;
}

button{
  width:100%;
  padding:16px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#876451;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  background:#ad8b78;
}

.logout-button{
  background:#9b4d45;
}

.hidden{
  display:none !important;
}

.message{
  text-align:center;
  font-weight:bold;
  margin:15px 0 0;
  min-height:20px;
  line-height:1.5;
}

.total{
  font-size:23px;
  text-align:center;
  padding:20px;
  margin-top:15px;
  border:1px dashed #876451;
  border-radius:15px;
}

.admin-status{
  text-align:center;
  font-size:14px;
  margin-bottom:15px;
  color:#876451;
  word-break:break-all;
}

.last-update{
  text-align:right;
  font-size:12px;
  margin-top:15px;
  color:#806b60;
}

footer{
  text-align:center;
  padding:20px;
  font-size:13px;
  color:#806b60;
}

@media(max-width:450px){
  header h1{
    font-size:28px;
  }

  .card{
    padding:20px;
  }

  .rate{
    font-size:17px;
  }
}
</style>
</head>


<body>

<header>
  <h1>VOPL GOLD</h1>
  <p>Live Gold & Silver Rates</p>
</header>


<div class="container">


  <!-- CUSTOMER RATE VIEW -->

  <div class="card">

    <h2>આજનો ભાવ</h2>


    <div class="rate">
      <span>Gold 24K</span>

      <span class="price">
        ₹<span id="gold24k">Loading...</span>
      </span>
    </div>


    <div class="rate">
      <span>Gold 22K</span>

      <span class="price">
        ₹<span id="gold22k">Loading...</span>
      </span>
    </div>


    <div class="rate">
      <span>Gold 18K</span>

      <span class="price">
        ₹<span id="gold18k">Loading...</span>
      </span>
    </div>


    <div class="rate">
      <span>Silver 999</span>

      <span class="price">
        ₹<span id="silver999">Loading...</span>
      </span>
    </div>


    <div class="last-update">
      Last Update:
      <span id="lastUpdate">--</span>
    </div>

  </div>



  <!-- CALCULATOR -->

  <div class="card">

    <h2>Rate Calculator</h2>


    <select id="calcItem">

      <option value="gold24k">
        Gold 24K - 10 Gram
      </option>

      <option value="gold22k">
        Gold 22K - 10 Gram
      </option>

      <option value="gold18k">
        Gold 18K - 10 Gram
      </option>

      <option value="silver999">
        Silver 999 - 1 KG
      </option>

    </select>


    <input
      id="weight"
      type="number"
      inputmode="decimal"
      step="0.001"
      placeholder="વજન ગ્રામમાં દાખલ કરો"
    >


    <button id="calculateBtn">
      હિસાબ કરો
    </button>


    <div class="total">

      કુલ રકમ:

      ₹<span id="total">0</span>

    </div>

  </div>



  <!--
  ADMIN LOGIN

  NORMAL CUSTOMER LINK:
  https://YOUR-SITE/

  ADMIN LINK:
  https://YOUR-SITE/?admin=vopl
  -->


  <div
    id="loginBox"
    class="card hidden"
  >

    <h2>🔐 Admin Login</h2>


    <input
      id="adminEmail"
      type="email"
      autocomplete="username"
      placeholder="Admin Email"
    >


    <input
      id="adminPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Admin Password"
    >


    <button id="loginBtn">
      LOGIN
    </button>


    <button
      id="closeLoginBtn"
      class="secondary"
    >
      CLOSE
    </button>


    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>



  <!-- ADMIN PANEL -->


  <div
    id="adminBox"
    class="card hidden"
  >

    <h2>🔐 Admin Panel</h2>


    <div
      id="adminStatus"
      class="admin-status"
    ></div>


    <input
      id="newGold24k"
      type="number"
      inputmode="decimal"
      placeholder="Gold 24K Rate"
    >


    <input
      id="newGold22k"
      type="number"
      inputmode="decimal"
      placeholder="Gold 22K Rate"
    >


    <input
      id="newGold18k"
      type="number"
      inputmode="decimal"
      placeholder="Gold 18K Rate"
    >


    <input
      id="newSilver999"
      type="number"
      inputmode="decimal"
      placeholder="Silver 999 Rate"
    >


    <button id="updateBtn">
      SAVE ALL RATES
    </button>


    <button
      id="logoutBtn"
      class="logout-button"
    >
      LOGOUT
    </button>


    <div
      id="adminMessage"
      class="message"
    ></div>

  </div>


  <div
    id="publicMessage"
    class="message"
  ></div>


</div>


<footer>
  © Vrundavan Ornaments Pvt. Ltd.
</footer>



<script type="module">


/* ===================================
   FIREBASE IMPORTS
=================================== */


import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  onSnapshot,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";



/* ===================================
   FIREBASE CONFIG
=================================== */


const firebaseConfig = {

  apiKey:
  "AIzaSyACpWFqxs1AaIx7C6kMpu45bD79fWJeR60",

  authDomain:
  "reset-de458.firebaseapp.com",

  projectId:
  "reset-de458",

  storageBucket:
  "reset-de458.firebasestorage.app",

  messagingSenderId:
  "192490668353",

  appId:
  "1:192490668353:web:e8ce193dab2d3c4f7061c0",

  measurementId:
  "G-NKVEWN4YSC"

};



/* ===================================
   SETTINGS
=================================== */


const ADMIN_EMAIL =
  "office.vopl@gmail.com";


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


const rateRef =
  doc(db,"rates","current");



/* ===================================
   ELEMENTS
=================================== */


const gold24kEl =
  document.getElementById("gold24k");


const gold22kEl =
  document.getElementById("gold22k");


const gold18kEl =
  document.getElementById("gold18k");


const silver999El =
  document.getElementById("silver999");


const lastUpdate =
  document.getElementById("lastUpdate");


const loginBox =
  document.getElementById("loginBox");


const adminBox =
  document.getElementById("adminBox");


const adminEmail =
  document.getElementById("adminEmail");


const adminPassword =
  document.getElementById("adminPassword");


const loginBtn =
  document.getElementById("loginBtn");


const closeLoginBtn =
  document.getElementById("closeLoginBtn");


const loginMessage =
  document.getElementById("loginMessage");


const adminStatus =
  document.getElementById("adminStatus");


const newGold24k =
  document.getElementById("newGold24k");


const newGold22k =
  document.getElementById("newGold22k");


const newGold18k =
  document.getElementById("newGold18k");


const newSilver999 =
  document.getElementById("newSilver999");


const updateBtn =
  document.getElementById("updateBtn");


const logoutBtn =
  document.getElementById("logoutBtn");


const adminMessage =
  document.getElementById("adminMessage");


const publicMessage =
  document.getElementById("publicMessage");



/* ===================================
   ADMIN MODE
=================================== */


const params =
  new URLSearchParams(
    window.location.search
  );


const adminMode =
  params.get("admin") === "vopl";



/* ===================================
   RATES
=================================== */


let rates = {

  gold24k:0,

  gold22k:0,

  gold18k:0,

  silver999:0

};



/* ===================================
   HELPERS
=================================== */


function formatPrice(value){

  return Number(value || 0)
    .toLocaleString("en-IN");

}


function isAdminUser(user){

  return Boolean(

    user &&

    user.email &&

    user.email.toLowerCase()

    ===

    ADMIN_EMAIL.toLowerCase()

  );

}


function showPublicMessage(text){

  publicMessage.textContent =
    text;

}


function formatTime(timestamp){

  if(

    !timestamp ||

    typeof timestamp.toDate

    !==

    "function"

  ){

    return "--";

  }


  return timestamp
    .toDate()
    .toLocaleString(

      "en-IN",

      {

        day:"2-digit",

        month:"2-digit",

        year:"numeric",

        hour:"2-digit",

        minute:"2-digit"

      }

    );

}


function updateScreen(){


  gold24kEl.textContent =

    formatPrice(
      rates.gold24k
    );


  gold22kEl.textContent =

    formatPrice(
      rates.gold22k
    );


  gold18kEl.textContent =

    formatPrice(
      rates.gold18k
    );


  silver999El.textContent =

    formatPrice(
      rates.silver999
    );


  newGold24k.value =

    rates.gold24k || "";


  newGold22k.value =

    rates.gold22k || "";


  newGold18k.value =

    rates.gold18k || "";


  newSilver999.value =

    rates.silver999 || "";

}



/* ===================================
   FIRESTORE LIVE RATES
=================================== */


onSnapshot(

  rateRef,


  snapshot => {


    if(

      !snapshot.exists()

    ){


      gold24kEl.textContent =
        "No Data";


      gold22kEl.textContent =
        "No Data";


      gold18kEl.textContent =
        "No Data";


      silver999El.textContent =
        "No Data";


      lastUpdate.textContent =
        "No Firestore Data";


      return;

    }


    const data =
      snapshot.data();



    rates.gold24k =

      Number(
        data.gold24k || 0
      );


    rates.gold22k =

      Number(
        data.gold22k || 0
      );


    rates.gold18k =

      Number(
        data.gold18k || 0
      );


    rates.silver999 =

      Number(
        data.silver999 || 0
      );



    updateScreen();



    lastUpdate.textContent =

      formatTime(
        data.updatedAt
      );


    showPublicMessage("");


  },


  error => {


    console.error(

      "Firestore Read Error:",

      error

    );


    showPublicMessage(

      "Rate Load Error: " +

      (
        error.code ||
        error.message
      )

    );


  }

);



/* ===================================
   CALCULATOR
=================================== */


document
.getElementById("calculateBtn")
.addEventListener(

  "click",

  () => {


    const item =

      document
      .getElementById("calcItem")
      .value;


    const weight =

      Number(

        document
        .getElementById("weight")
        .value

      );


    if(

      !Number.isFinite(weight)

      ||

      weight <= 0

    ){


      showPublicMessage(

        "સાચું વજન દાખલ કરો."

      );


      return;

    }



    const rate =

      Number(

        rates[item] || 0

      );



    if(

      !Number.isFinite(rate)

      ||

      rate <= 0

    ){


      showPublicMessage(

        "Rate ઉપલબ્ધ નથી."

      );


      return;

    }



    let total = 0;



    if(

      item === "silver999"

    ){


      total =

        (rate / 1000)

        *

        weight;


    }


    else{


      total =

        (rate / 10)

        *

        weight;


    }



    document
    .getElementById("total")
    .textContent =

      Math.round(total)
      .toLocaleString("en-IN");


    showPublicMessage("");


  }

);



/* ===================================
   ADMIN MODE START
=================================== */


if(adminMode){


  adminEmail.value =
    ADMIN_EMAIL;


  loginBox
    .classList
    .remove("hidden");


}



/* ===================================
   ADMIN LOGIN
=================================== */


loginBtn.addEventListener(

  "click",

  async () => {


    const email =

      adminEmail
      .value
      .trim()
      .toLowerCase();


    const password =

      adminPassword
      .value;



    if(

      !email

      ||

      !password

    ){


      loginMessage.textContent =

        "Email અને Password દાખલ કરો.";


      return;

    }



    if(

      email

      !==

      ADMIN_EMAIL.toLowerCase()

    ){


      loginMessage.textContent =

        "આ Email Admin નથી.";


      return;

    }



    loginBtn.disabled = true;


    loginMessage.textContent =

      "Login થઈ રહ્યું છે...";



    try{


      const credential =

        await signInWithEmailAndPassword(

          auth,

          email,

          password

        );



      if(

        !isAdminUser(

          credential.user

        )

      ){


        await signOut(auth);


        loginMessage.textContent =

          "Unauthorized Account";


        return;

      }



      loginBox
        .classList
        .add("hidden");


      adminBox
        .classList
        .remove("hidden");


      adminStatus.textContent =

        "Logged in: " +

        credential.user.email;


      adminPassword.value = "";


      loginMessage.textContent = "";


      updateScreen();



      adminBox
        .scrollIntoView({

          behavior:"smooth",

          block:"start"

        });


    }


    catch(error){


      console.error(

        "Login Error:",

        error

      );


      if(

        error.code

        ===

        "auth/invalid-credential"

      ){


        loginMessage.textContent =

          "Email અથવા Password ખોટો છે.";


      }


      else{


        loginMessage.textContent =

          "Login Failed: " +

          (
            error.code ||
            error.message
          );


      }


    }


    finally{


      loginBtn.disabled = false;


    }


  }

);



/* ===================================
   ENTER KEY LOGIN
=================================== */


adminPassword.addEventListener(

  "keydown",

  event => {


    if(

      event.key === "Enter"

    ){


      loginBtn.click();


    }


  }

);



/* ===================================
   CLOSE LOGIN
=================================== */


closeLoginBtn.addEventListener(

  "click",

  () => {


    loginBox
      .classList
      .add("hidden");


    adminPassword.value = "";


    loginMessage.textContent = "";


  }

);



/* ===================================
   AUTH STATE CHECK
=================================== */


onAuthStateChanged(

  auth,

  user => {


    /*

    CUSTOMER NORMAL URL

    ADMIN PANEL NEVER SHOW

    */


    if(!adminMode){


      loginBox
        .classList
        .add("hidden");


      adminBox
        .classList
        .add("hidden");


      return;

    }



    /* ADMIN URL + VALID LOGIN */


    if(

      isAdminUser(user)

    ){


      loginBox
        .classList
        .add("hidden");


      adminBox
        .classList
        .remove("hidden");


      adminStatus.textContent =

        "Logged in: " +

        user.email;


      updateScreen();


      return;

    }



    /* ADMIN URL BUT NOT LOGGED IN */


    adminBox
      .classList
      .add("hidden");


    loginBox
      .classList
      .remove("hidden");


    adminEmail.value =
      ADMIN_EMAIL;


  }

);



/* ===================================
   UPDATE RATES
=================================== */


updateBtn.addEventListener(

  "click",

  async () => {


    const user =
      auth.currentUser;



    if(

      !adminMode

      ||

      !isAdminUser(user)

    ){


      adminMessage.textContent =

        "Admin authorization failed.";


      return;

    }



    const values = {


      gold24k:

        Number(
          newGold24k.value
        ),


      gold22k:

        Number(
          newGold22k.value
        ),


      gold18k:

        Number(
          newGold18k.value
        ),


      silver999:

        Number(
          newSilver999.value
        )


    };



    if(

      !Number.isFinite(

        values.gold24k

      )

      ||

      !Number.isFinite(

        values.gold22k

      )

      ||

      !Number.isFinite(

        values.gold18k

      )

      ||

      !Number.isFinite(

        values.silver999

      )

      ||

      values.gold24k <= 0

      ||

      values.gold22k <= 0

      ||

      values.gold18k <= 0

      ||

      values.silver999 <= 0

    ){


      adminMessage.textContent =

        "બધા સાચા Rates દાખલ કરો.";


      return;

    }



    updateBtn.disabled = true;


    adminMessage.textContent =

      "Rates Save થઈ રહ્યા છે...";



    try{


      await setDoc(

        rateRef,

        {

          ...values,

          updatedAt:

            serverTimestamp(),

          updatedBy:

            user.email

        },

        {

          merge:true

        }

      );



      rates = {

        ...rates,

        ...values

      };


      updateScreen();



      adminMessage.textContent =

        "Rates Successfully Updated.";


    }


    catch(error){


      console.error(

        "Update Error:",

        error

      );


      if(

        error.code

        ===

        "permission-denied"

      ){


        adminMessage.textContent =

          "Permission Denied. Firestore Rules check કરો.";


      }


      else{


        adminMessage.textContent =

          "Update Failed: " +

          (
            error.code ||
            error.message
          );


      }


    }


    finally{


      updateBtn.disabled = false;


    }


  }

);



/* ===================================
   LOGOUT
=================================== */


logoutBtn.addEventListener(

  "click",

  async () => {


    try{


      await signOut(auth);


      adminBox
        .classList
        .add("hidden");


      if(adminMode){


        loginBox
          .classList
          .remove("hidden");


        adminEmail.value =
          ADMIN_EMAIL;


      }


      adminPassword.value = "";


      adminMessage.textContent = "";


      loginMessage.textContent =

        "Logged Out.";


    }


    catch(error){


      adminMessage.textContent =

        "Logout Failed: " +

        (
          error.code ||
          error.message
        );


    }


  }

);


</script>

</body>
</html>
