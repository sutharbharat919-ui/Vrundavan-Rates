<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOPL GOLD</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f7f0e8;
  color:#49372f;
}

header{
  background:#876451;
  color:#fff;
  text-align:center;
  padding:24px 15px;
}

.logo{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:50%;
  background:white;
  padding:5px;
  margin-bottom:8px;
}

header h1{
  margin:4px 0;
  font-size:34px;
}

header p{
  margin:5px 0 0;
  font-size:17px;
}

.container{
  width:100%;
  max-width:750px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border:1px solid #d5c0b1;
  border-radius:22px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
}

h2{
  margin-top:0;
}

.rate{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px 0;
  border-bottom:1px solid #eee;
  font-size:20px;
}

.rate:last-child{
  border-bottom:none;
}

.price{
  font-weight:bold;
  color:#876451;
  white-space:nowrap;
}

input,
select{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #cbb6a7;
  border-radius:12px;
  font-size:17px;
  background:#fff;
  color:#49372f;
}

button{
  width:100%;
  padding:16px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#876451;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  background:#ad8b78;
}

.hidden{
  display:none !important;
}

.total{
  font-size:23px;
  text-align:center;
  padding:20px;
  margin-top:15px;
  border:1px dashed #876451;
  border-radius:15px;
  font-weight:bold;
}

#message{
  text-align:center;
  font-weight:bold;
  min-height:24px;
  margin:15px 0;
}

.admin-status{
  text-align:center;
  font-size:14px;
  margin-bottom:15px;
}

.last-update{
  text-align:right;
  font-size:14px;
  margin-top:18px;
  color:#8b7b72;
}

.admin-title{
  text-align:center;
  margin-bottom:18px;
}

@media(max-width:500px){

  .container{
    padding:14px;
  }

  .card{
    padding:20px;
  }

  .rate{
    font-size:18px;
  }

  header h1{
    font-size:30px;
  }
}
</style>
</head>


<body>


<header>

  <!--
  અહીં તમારો logo URL નાખી શકો.
  હાલ logo ન મળે તો hide થઈ જશે.
  -->

  <img
    id="companyLogo"
    class="logo"
    src="logo.png"
    alt="VOPL Logo"
    onerror="this.style.display='none'"
  >

  <h1>VOPL GOLD</h1>

  <p>Live Gold & Silver Rates</p>

</header>



<div class="container">


<!-- ========================= -->
<!-- CUSTOMER RATE SECTION -->
<!-- ========================= -->


<div class="card">

<h2>આજનો ભાવ</h2>


<div class="rate">

<span>Gold 24K</span>

<span class="price">
₹<span id="gold24k">Loading...</span>
</span>

</div>


<div class="rate">

<span>Gold 22K</span>

<span class="price">
₹<span id="gold22k">Loading...</span>
</span>

</div>


<div class="rate">

<span>Gold 18K</span>

<span class="price">
₹<span id="gold18k">Loading...</span>
</span>

</div>


<div class="rate">

<span>Silver 999</span>

<span class="price">
₹<span id="silver999">Loading...</span>
</span>

</div>


<div
  id="lastUpdate"
  class="last-update"
>
Last Update: -
</div>


</div>



<!-- ========================= -->
<!-- RATE CALCULATOR -->
<!-- ========================= -->


<div class="card">

<h2>Rate Calculator</h2>


<select id="calcItem">

<option value="gold24k">
Gold 24K - 10 Gram
</option>

<option value="gold22k">
Gold 22K - 10 Gram
</option>

<option value="gold18k">
Gold 18K - 10 Gram
</option>

<option value="silver999">
Silver 999 - 1 KG
</option>

</select>


<input
  id="weight"
  type="number"
  min="0"
  step="0.001"
  placeholder="વજન ગ્રામમાં દાખલ કરો"
>


<button id="calculateBtn">
હિસાબ કરો
</button>


<div class="total">

કુલ રકમ:
₹<span id="total">0</span>

</div>


</div>



<!-- ========================= -->
<!-- ADMIN LOGIN -->
<!-- ONLY ADMIN URL -->
<!-- ========================= -->


<div
  id="adminLoginBox"
  class="card hidden"
>


<h2 class="admin-title">
🔐 Admin Login
</h2>


<input
  id="email"
  type="email"
  placeholder="Admin Email"
  autocomplete="username"
>


<input
  id="password"
  type="password"
  placeholder="Password"
  autocomplete="current-password"
>


<button id="loginBtn">
LOGIN
</button>


<button
  id="closeAdminBtn"
  class="secondary"
>
CLOSE ADMIN MODE
</button>


</div>



<!-- ========================= -->
<!-- ADMIN PANEL -->
<!-- LOGIN SUCCESS પછી જ -->
<!-- ========================= -->


<div
  id="adminBox"
  class="card hidden"
>


<h2 class="admin-title">
🔒 Admin Panel
</h2>


<div
  id="adminStatus"
  class="admin-status"
>
Admin Logged In
</div>


<input
  id="newGold24k"
  type="number"
  min="0"
  step="0.01"
  placeholder="Gold 24K Rate"
>


<input
  id="newGold22k"
  type="number"
  min="0"
  step="0.01"
  placeholder="Gold 22K Rate"
>


<input
  id="newGold18k"
  type="number"
  min="0"
  step="0.01"
  placeholder="Gold 18K Rate"
>


<input
  id="newSilver999"
  type="number"
  min="0"
  step="0.01"
  placeholder="Silver 999 Rate"
>


<button id="updateBtn">
SAVE ALL RATES
</button>


<button
  id="logoutBtn"
  class="secondary"
>
LOGOUT
</button>


</div>



<div id="message"></div>


</div>



<script type="module">


/* ============================= */
/* FIREBASE IMPORTS */
/* ============================= */


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  onSnapshot,
  setDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";



/* ============================= */
/* FIREBASE CONFIG */
/* ============================= */


const firebaseConfig = {

  apiKey:
  "AIzaSyACpWFqxs1AaIx7C6kMpu45bD79fWJeR60",

  authDomain:
  "reset-de458.firebaseapp.com",

  projectId:
  "reset-de458",

  storageBucket:
  "reset-de458.firebasestorage.app",

  messagingSenderId:
  "192490668353",

  appId:
  "1:192490668353:web:e8ce193dab2d3c4f7061c0",

  measurementId:
  "G-NKVEWN4YSC"

};



/* ============================= */
/* ADMIN EMAIL */
/* ============================= */


const ADMIN_EMAIL =
"office.vopl@gmail.com";



/* ============================= */
/* INITIALIZE FIREBASE */
/* ============================= */


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const rateRef =
doc(db,"rates","current");



/* ============================= */
/* ELEMENTS */
/* ============================= */


const gold24k =
document.getElementById("gold24k");


const gold22k =
document.getElementById("gold22k");


const gold18k =
document.getElementById("gold18k");


const silver999 =
document.getElementById("silver999");


const lastUpdate =
document.getElementById("lastUpdate");


const calcItem =
document.getElementById("calcItem");


const weight =
document.getElementById("weight");


const total =
document.getElementById("total");


const adminLoginBox =
document.getElementById("adminLoginBox");


const adminBox =
document.getElementById("adminBox");


const emailInput =
document.getElementById("email");


const passwordInput =
document.getElementById("password");


const newGold24k =
document.getElementById("newGold24k");


const newGold22k =
document.getElementById("newGold22k");


const newGold18k =
document.getElementById("newGold18k");


const newSilver999 =
document.getElementById("newSilver999");


const adminStatus =
document.getElementById("adminStatus");


const message =
document.getElementById("message");


const loginBtn =
document.getElementById("loginBtn");


const updateBtn =
document.getElementById("updateBtn");



/* ============================= */
/* ADMIN URL CHECK */
/* ============================= */


const params =
new URLSearchParams(window.location.search);


const isAdminURL =
params.get("admin") === "vopl";



/* ============================= */
/* RATE MEMORY */
/* ============================= */


let rates = {

  gold24k:0,

  gold22k:0,

  gold18k:0,

  silver999:0

};



/* ============================= */
/* HELPER FUNCTIONS */
/* ============================= */


function showMessage(text){

  message.textContent = text;

}


function formatMoney(value){

  const number = Number(value);

  if(!Number.isFinite(number)){

    return "0";

  }

  return number.toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );

}


function validRate(value){

  return (
    Number.isFinite(value) &&
    value >= 0
  );

}



/* ============================= */
/* REALTIME FIRESTORE RATES */
/* ============================= */


onSnapshot(

  rateRef,


  snapshot => {


    if(!snapshot.exists()){


      gold24k.textContent = "No Data";

      gold22k.textContent = "No Data";

      gold18k.textContent = "No Data";

      silver999.textContent = "No Data";


      lastUpdate.textContent =
      "Last Update: -";


      return;

    }



    const data =
    snapshot.data();



    rates.gold24k =
    Number(data.gold24k || 0);


    rates.gold22k =
    Number(data.gold22k || 0);


    rates.gold18k =
    Number(data.gold18k || 0);


    rates.silver999 =
    Number(data.silver999 || 0);



    gold24k.textContent =
    formatMoney(rates.gold24k);


    gold22k.textContent =
    formatMoney(rates.gold22k);


    gold18k.textContent =
    formatMoney(rates.gold18k);


    silver999.textContent =
    formatMoney(rates.silver999);



    newGold24k.value =
    rates.gold24k || "";


    newGold22k.value =
    rates.gold22k || "";


    newGold18k.value =
    rates.gold18k || "";


    newSilver999.value =
    rates.silver999 || "";



    if(
      data.updatedAt &&
      typeof data.updatedAt.toDate === "function"
    ){

      lastUpdate.textContent =

      "Last Update: " +

      data.updatedAt
      .toDate()
      .toLocaleString(
        "en-IN"
      );

    }

    else{

      lastUpdate.textContent =
      "Last Update: -";

    }


  },


  error => {


    console.error(error);


    gold24k.textContent = "Error";

    gold22k.textContent = "Error";

    gold18k.textContent = "Error";

    silver999.textContent = "Error";


    showMessage(
      "Rate Load Error: " +
      error.code
    );


  }

);



/* ============================= */
/* CALCULATOR */
/* ============================= */


document
.getElementById("calculateBtn")
.addEventListener(
"click",
()=>{


  const selected =
  calcItem.value;


  const enteredWeight =
  Number(weight.value);



  if(
    !Number.isFinite(enteredWeight) ||
    enteredWeight <= 0
  ){

    total.textContent = "0";

    showMessage(
      "સાચું વજન દાખલ કરો."
    );

    return;

  }



  const selectedRate =
  rates[selected] || 0;



  let amount = 0;



  if(selected === "silver999"){

    amount =
    selectedRate *
    enteredWeight /
    1000;

  }

  else{

    amount =
    selectedRate *
    enteredWeight /
    10;

  }



  total.textContent =
  formatMoney(amount);


  showMessage("");



});



/* ============================= */
/* ADMIN LOGIN */
/* ============================= */


loginBtn.addEventListener(
"click",
async()=>{


  const email =
  emailInput.value
  .trim()
  .toLowerCase();


  const password =
  passwordInput.value;



  if(!email || !password){

    showMessage(
      "Email અને Password દાખલ કરો."
    );

    return;

  }



  if(email !== ADMIN_EMAIL){

    showMessage(
      "આ Email Admin નથી."
    );

    return;

  }



  try{


    loginBtn.disabled = true;


    await signInWithEmailAndPassword(

      auth,

      email,

      password

    );


    passwordInput.value = "";


    showMessage(
      "Admin Login Successful"
    );


  }


  catch(error){


    console.error(error);


    showMessage(

      "Login Failed: " +
      error.code

    );


  }


  finally{

    loginBtn.disabled = false;

  }


});



/* ============================= */
/* AUTH STATE */
/* ============================= */


onAuthStateChanged(

auth,

async user => {


  const isAdmin =

  user &&

  user.email &&

  user.email.toLowerCase()
  === ADMIN_EMAIL;



  /*
  CUSTOMER NORMAL URL
  ADMIN કંઈ દેખાશે નહીં.
  */


  if(!isAdminURL){


    adminLoginBox
    .classList
    .add("hidden");


    adminBox
    .classList
    .add("hidden");


    return;

  }



  /*
  ADMIN URL
  */


  if(isAdmin){


    adminLoginBox
    .classList
    .add("hidden");


    adminBox
    .classList
    .remove("hidden");


    adminStatus.textContent =
    "Logged in: " +
    user.email;


  }


  else{


    /*
    Wrong account logged in હોય
    તો logout.
    */


    if(user){

      await signOut(auth);

    }


    adminBox
    .classList
    .add("hidden");


    adminLoginBox
    .classList
    .remove("hidden");


  }


});



/* ============================= */
/* UPDATE ALL RATES */
/* ============================= */


updateBtn.addEventListener(

"click",

async()=>{


  const user =
  auth.currentUser;



  if(

    !isAdminURL ||

    !user ||

    !user.email ||

    user.email.toLowerCase()
    !== ADMIN_EMAIL

  ){


    showMessage(
      "Admin Login જરૂરી છે."
    );


    return;

  }



  const g24 =
  Number(newGold24k.value);


  const g22 =
  Number(newGold22k.value);


  const g18 =
  Number(newGold18k.value);


  const silver =
  Number(newSilver999.value);



  if(

    !validRate(g24) ||

    !validRate(g22) ||

    !validRate(g18) ||

    !validRate(silver)

  ){


    showMessage(
      "બધા Rates સાચા દાખલ કરો."
    );


    return;

  }



  try{


    updateBtn.disabled = true;



    await setDoc(

      rateRef,

      {

        gold24k:g24,

        gold22k:g22,

        gold18k:g18,

        silver999:silver,

        updatedAt:
        serverTimestamp()

      },

      {
        merge:true
      }

    );



    showMessage(
      "બધા Rates Successfully Updated"
    );


  }


  catch(error){


    console.error(error);


    showMessage(

      "Update Failed: " +
      error.code

    );


  }


  finally{

    updateBtn.disabled = false;

  }


});



/* ============================= */
/* LOGOUT */
/* ============================= */


document
.getElementById("logoutBtn")
.addEventListener(

"click",

async()=>{


  await signOut(auth);


  showMessage(
    "Logged Out"
  );


});



/* ============================= */
/* CLOSE ADMIN MODE */
/* ============================= */


document
.getElementById("closeAdminBtn")
.addEventListener(

"click",

()=>{


  window.location.href =
  window.location.pathname;


});


</script>


</body>
</html>
