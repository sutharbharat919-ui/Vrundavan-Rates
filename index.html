
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updating</title>

<!-- Google Fonts & FontAwesome -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    /* ફાયર ટાઇપ લુક માટે ડાર્ક રેડિશ-બ્લેક બેકગ્રાઉન્ડ */
    background: radial-gradient(circle at center, #1c0a02 0%, #0a0401 100%);
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Center Message */
  .message-container {
    text-align: center;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  /* Updating this side... (Fire & Blinking Effect) */
  .msg-main {
    font-size: 32px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 15px;
    text-transform: uppercase;
    /* ફાયર ગ્લો અને બ્લિંકિંગ એનિમેશન */
    animation: fireBlink 2s infinite alternate;
  }

  /* Thank you! */
  .msg-thanks {
    font-size: 18px;
    color: #ff9f43;
    font-weight: 400;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(255, 159, 67, 0.5);
    opacity: 0.8;
  }

  /* Premium Footer for Developer */
  .dev-footer {
    position: absolute;
    bottom: 30px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.8px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 300;
  }

  .dev-footer span {
    font-weight: 500;
    color: #ff9f43;
  }

  .insta-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    color: rgba(255, 255, 255, 0.4);
    text-decoration: none;
    font-size: 12px;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.02);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255, 159, 67, 0.1);
  }

  .insta-link i {
    font-size: 14px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .insta-link:hover {
    color: #fff;
    border-color: rgba(255, 159, 67, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(255, 159, 67, 0.2);
  }

  /* Fire Glowing & Blinking Animation Logic */
  @keyframes fireBlink {
    0% {
      text-shadow: 
        0 0 4px #fff, 
        0 0 10px #ffdd00, 
        0 0 20px #ff8800, 
        0 0 30px #ff3300;
      opacity: 1;
    }
    50% {
      text-shadow: 
        0 0 4px #fff, 
        0 0 15px #ffdd00, 
        0 0 30px #ffbb00, 
        0 0 40px #ff4400,
        0 0 60px #ff0000;
      opacity: 0.85;
    }
    100% {
      text-shadow: 
        0 0 2px #fff, 
        0 0 8px #ffaa00, 
        0 0 15px #ff5500, 
        0 0 25px #cc1100;
      opacity: 0.6;
    }
  }
</style>
</head>
<body>

<!-- Center Message -->
<div class="message-container">
  <div class="msg-main">Updating this side...</div>
  <div class="msg-thanks">Thank you!</div>
</div>

<!-- Developer Footer -->
<div class="dev-footer">
  Developer by <span>Bharat Suthar</span>
  <br>
  <a href="https://www.instagram.com/b_s_0022?igsh=MWthbDZqeGdldjc2dA==" target="_blank" class="insta-link">
    <i class="fa-brands fa-instagram"></i> Instagram
  </a>
</div>

</body>
</html>
