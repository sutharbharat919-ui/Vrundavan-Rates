<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOPL GOLD</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f0e8;
color:#49372f;
}

header{
background:#876451;
color:white;
text-align:center;
padding:25px 15px;
}

header h1{
margin:0;
font-size:34px;
}

.container{
max-width:750px;
margin:auto;
padding:18px;
}

.card{
background:white;
border:1px solid #d5c0b1;
border-radius:22px;
padding:25px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.rate{
display:flex;
justify-content:space-between;
padding:18px 0;
border-bottom:1px solid #eee;
font-size:20px;
}

.price{
font-weight:bold;
color:#876451;
}

input,select{
width:100%;
padding:15px;
margin:8px 0;
border:1px solid #cbb6a7;
border-radius:12px;
font-size:17px;
}

button{
width:100%;
padding:16px;
margin-top:10px;
border:0;
border-radius:12px;
background:#876451;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.secondary{
background:#ad8b78;
}

.hidden{
display:none !important;
}

#message{
text-align:center;
font-weight:bold;
margin:15px;
}

.total{
font-size:23px;
text-align:center;
padding:20px;
margin-top:15px;
border:1px dashed #876451;
border-radius:15px;
}

.admin-status{
text-align:center;
font-size:14px;
margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>VOPL GOLD</h1>
<p>Live Gold & Silver Rates</p>
</header>

<div class="container">

<div class="card">
<h2>આજનો ભાવ</h2>

<div class="rate">
<span>Gold 24K</span>
<span class="price">₹<span id="gold24k">Loading...</span></span>
</div>

<div class="rate">
<span>Gold 22K</span>
<span class="price">₹<span id="gold22k">Loading...</span></span>
</div>

<div class="rate">
<span>Gold 18K</span>
<span class="price">₹<span id="gold18k">Loading...</span></span>
</div>

<div class="rate">
<span>Silver 999</span>
<span class="price">₹<span id="silver999">Loading...</span></span>
</div>

</div>


<div class="card">

<h2>Rate Calculator</h2>

<select id="calcItem">
<option value="gold24k">Gold 24K - 10 Gram</option>
<option value="gold22k">Gold 22K - 10 Gram</option>
<option value="gold18k">Gold 18K - 10 Gram</option>
<option value="silver999">Silver 999 - 1 KG</option>
</select>

<input
id="weight"
type="number"
step="0.001"
placeholder="વજન ગ્રામમાં દાખલ કરો"
>

<button id="calculateBtn">
હિસાબ કરો
</button>

<div class="total">
કુલ રકમ: ₹<span id="total">0</span>
</div>

</div>


<!--
CUSTOMER માટે કોઈ ADMIN BUTTON નથી.
આ section માત્ર ADMIN login થયા પછી દેખાશે.
-->

<div id="adminBox" class="card hidden">

<h2>🔐 Admin Panel</h2>

<div class="admin-status">
Logged in: office.vopl@gmail.com
</div>

<input
id="newGold24k"
type="number"
placeholder="Gold 24K Rate"
>

<input
id="newGold22k"
type="number"
placeholder="Gold 22K Rate"
>

<input
id="newGold18k"
type="number"
placeholder="Gold 18K Rate"
>

<input
id="newSilver999"
type="number"
placeholder="Silver 999 Rate"
>

<button id="updateBtn">
SAVE ALL RATES
</button>

<button id="logoutBtn" class="secondary">
LOGOUT
</button>

</div>

<div id="
