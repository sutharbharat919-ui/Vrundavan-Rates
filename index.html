<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOPL GOLD</title>

<style>
:root{
    --bg:#F5EEE8;
    --surface:#FFFDFC;
    --soft:#F1E5DC;
    --light:#E8D8CC;
    --coffee:#C7A995;
    --medium:#9B7964;
    --button:#6E5142;
    --dark:#4A352B;
    --text:#352721;
    --muted:#806B60;
    --border:#DDCEC4;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
}

header{
    padding:30px 16px;
    text-align:center;
    background:var(--light);
    border-bottom:1px solid var(--coffee);
}

header h1{
    margin:0;
    color:var(--dark);
    font-size:27px;
}

header p{
    margin:8px 0 0;
    color:var(--button);
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:22px 14px 45px;
}

.card{
    margin-bottom:20px;
    padding:21px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 8px 25px rgba(74,53,43,.07);
}

.card h2{
    margin:0 0 18px;
    padding-bottom:12px;
    color:var(--dark);
    border-bottom:1px solid var(--light);
}

.rate{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:17px 13px;
    background:#F8F2ED;
    border:1px solid #E8DDD5;
    border-radius:12px;
}

.price{
    color:var(--dark);
    font-size:20px;
    font-weight:700;
    white-space:nowrap;
}

input,
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:11px;
    font-size:15px;
}

input{
    color:var(--text);
    background:#FFF;
    border:1px solid var(--coffee);
    outline:none;
}

input:focus{
    border-color:var(--button);
    box-shadow:0 0 0 3px rgba(110,81,66,.10);
}

button{
    border:0;
    color:#FFF;
    background:var(--button);
    font-weight:700;
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.secondary{
    color:var(--dark);
    background:var(--light);
}

.hidden{
    display:none;
}

.status{
    margin-top:14px;
    padding:12px;
    background:var(--soft);
    border-radius:10px;
    color:var(--dark);
    text-align:center;
    font-size:14px;
    min-height:42px;
}

.admin-email{
    padding:11px;
    margin-bottom:12px;
    background:var(--soft);
    border-radius:10px;
    color:var(--dark);
    font-size:13px;
    word-break:break-word;
}

.help{
    margin-top:12px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

footer{
    padding:20px;
    color:var(--muted);
    text-align:center;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <h1>VOPL GOLD</h1>
    <p>Live Gold Rate</p>
</header>

<div class="container">

    <!-- CUSTOMER RATE -->

    <div class="card">

        <h2>આજનો ભાવ</h2>

        <div class="rate">

            <span>Gold 24K</span>

            <span class="price">
                ₹<span id="gold24k">Loading...</span>
            </span>

        </div>

    </div>


    <!-- EMAIL LINK LOGIN -->

    <div id="loginBox" class="card">

        <h2>Admin Panel</h2>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Admin Email"
        >

        <button id="send
