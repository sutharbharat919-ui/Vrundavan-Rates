<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vrundavan Ornaments - Updating</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg: #f7f2ee;
    --heading: #49362d;
    --coffee: #b9967d;
    --dark: #765543;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    font-family: 'Noto Serif Gujarati', serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }

  /* Center Container Layout */
  .update-box {
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(73, 54, 45, 0.1);
    border: 1px solid #e2d3c9;
    max-width: 450px;
    width: 100%;
    position: relative;
  }

  /* Decorative top border line */
  .update-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #aa771c 100%);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
  }

  .brand-name {
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--coffee);
    letter-spacing: 1px;
    margin-bottom: 25px;
  }

  /* Animated Gear / Loader Icon */
  .icon-wrapper {
    margin-bottom: 20px;
  }
  .icon-wrapper i {
    font-size: 45px;
    color: var(--dark);
    animation: rotateGear 3s linear infinite;
  }

  .main-text {
    font-size: 22px;
    color: var(--heading);
    font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .thanks-text {
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    color: var(--coffee);
    font-weight: 600;
    margin-top: 15px;
  }

  @keyframes rotateGear {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="update-box">
  <div class="brand-name">VRUNDAVAN ORNAMENTS</div>
  
  <div class="icon-wrapper">
    <i class="fa-solid fa-gears"></i>
  </div>
  
  <div class="main-text">Updating this side...</div>
  <div class="thanks-text">Thank you!</div>
</div>

</body>
</html>
