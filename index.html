<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOPL GOLD</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px;
      text-align: center;
      background: #161616;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      color: #d4af37;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #191919;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .rate {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      padding: 20px 0;
    }

    .price {
      color: #d4af37;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #d4af37;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #333;
      color: white;
    }

    .hidden {
      display: none;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>VOPL GOLD</h1>
  <div>Live Gold Rates</div>
</header>

<div class="container">

  <!-- CUSTOMER RATE VIEW -->

  <div class="card">

    <h2>Today's Rate</h2>

    <div class="rate">
      <span>Gold 24K</span>
      <span class="price">
        ₹<span id="gold24k">Loading...</span>
      </span>
    </div>

  </div>


  <!-- ADMIN LOGIN -->

  <div id="loginBox" class="card">

    <h2>Admin Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminBox" class="card hidden">

    <h2>Admin Rate Update</h2>

    <input
      id="newGold24k"
      type="number"
      step="0.01"
      placeholder="Enter Gold 24K Rate"
    >

    <button id="updateBtn">
      Update Rate
    </button>

    <button id="logoutBtn" class="secondary">
      Logout
    </button>

  </div>

  <div id="message"></div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  onSnapshot,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";



const firebaseConfig = {

  apiKey: "AIzaSyACpWFqxs1AaIx7C6kMpu45bD79fWJeR60",

  authDomain: "reset-de458.firebaseapp.com",

  projectId: "reset-de458",

  storageBucket: "reset-de458.firebasestorage.app",

  messagingSenderId: "192490668353",

  appId: "1:192490668353:web:e8ce193dab2d3c4f7061c0",

  measurementId: "G-NKVEWN4YSC"

};



const ADMIN_EMAIL = "office.vopl@gmail.com";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const rateRef = doc(db, "rates", "current");


const gold24k = document.getElementById("gold24k");

const loginBox = document.getElementById("loginBox");

const adminBox = document.getElementById("adminBox");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const newGoldInput = document.getElementById("newGold24k");

const message = document.getElementById("message");



function showMessage(text) {

  message.textContent = text;

}



/* LIVE RATE */

onSnapshot(

  rateRef,

  (snapshot) => {

    if (snapshot.exists()) {

      const data = snapshot.data();

      gold24k.textContent =
        Number(data.gold24k || 0).toLocaleString("en-IN");

      newGoldInput.value = data.gold24k || "";

    }

    else {

      gold24k.textContent = "No Data";

    }

  },

  (error) => {

    console.error(error);

    gold24k.textContent = "Error";

  }

);



/* LOGIN */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

  const email = emailInput.value.trim();

  const password = passwordInput.value;


  if (!email || !password) {

    showMessage("Email અને password દાખલ કરો.");

    return;

  }


  try {

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    if (credential.user.email !== ADMIN_EMAIL) {

      await signOut(auth);

      showMessage("આ account admin નથી.");

      return;

    }


    showMessage("Admin Login Successful");


  }

  catch (error) {

    console.error(error);

    showMessage("Login Failed: " + error.code);

  }

});



/* AUTH STATUS */

onAuthStateChanged(auth, (user) => {

  const isAdmin =
    user &&
    user.email === ADMIN_EMAIL;


  if (isAdmin) {

    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

  }

  else {

    loginBox.classList.remove("hidden");

    adminBox.classList.add("hidden");

  }

});



/* UPDATE RATE */

document
.getElementById("updateBtn")
.addEventListener("click", async () => {

  const value = Number(newGoldInput.value);


  if (!Number.isFinite(value) || value <= 0) {

    showMessage("સાચો rate દાખલ કરો.");

    return;

  }


  const user = auth.currentUser;


  if (!user || user.email !== ADMIN_EMAIL) {

    showMessage("Admin login જરૂરી છે.");

    return;

  }


  try {

    await updateDoc(rateRef, {

      gold24k: value

    });


    showMessage("Rate Successfully Updated");


  }

  catch (error) {

    console.error(error);

    showMessage("Update Failed: " + error.code);

  }

});



/* LOGOUT */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await signOut(auth);

  showMessage("Logged Out");

});


</script>

</body>
</html>
